<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео - ГУМРФ</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px 30px;
        }
        .header h2 {
            margin: 0;
            font-weight: 400;
        }
        .header h2 span {
            font-weight: 700;
            color: #ffd700;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .footer {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        .info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #495057;
            font-size: 14px;
        }
        .badge {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .note {
            margin-top: 10px;
            padding: 10px;
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            border-radius: 4px;
        }
        .note a {
            color: #0066cc;
            text-decoration: none;
        }
        .note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2> Для · <span>Наташи</span></h2>
        </div>
        
        <!-- ВСТРОЕННЫЙ ПЛЕЕР GOOGLE DRIVE (РАБОТАЕТ ВСЕГДА) -->
        <div class="video-container">
            <iframe src="https://drive.google.com/file/d/1T2UskE9-aNqsVeAA5KS1_sIfvfxi8fk7/preview" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
            </iframe>
        </div>
        
        <div class="footer">
            <div class="info">
                <span class="badge">ID: 1T2UskE9-aNqsVeAA5KS1_sIfvfxi8fk7</span>
                <span>📁 Источник: Google Drive</span>
            </div>

</body>
