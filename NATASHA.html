<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео с Google Drive (альтернатива)</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            padding: 30px;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        .video-container {
            margin: 20px 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .button {
            display: inline-block;
            background: #1a73e8;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background: #1557b0;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 14px;
        }
        .small {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📽️ Видеофайл</h2>
        <p>ID видео: <code>1T2UskE9-aNqsVeAA5KS1_sIfvfxi8fk7</code></p>
        
        <div class="video-container">
            <!-- Попытка встроить видео через ссылку на скачивание -->
            <video id="driveVideo" controls muted playsinline>
                <source src="" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
        </div>
        
        <button class="button" id="loadVideoBtn">🔁 Загрузить видео в плеер</button>
        
        <div class="warning">
            ⚠️ <strong>Важно:</strong> Google Drive часто блокирует прямые ссылки на видео. 
            Если видео не загружается, используйте стандартный плеер Drive (код в Варианте 1).
        </div>
        <p class="small">Попытка загрузить с: <span id="urlDisplay"></span></p>
    </div>

    <script>
        const VIDEO_ID = '1T2UskE9-aNqsVeAA5KS1_sIfvfxi8fk7';
        
        // Пытаемся получить прямую ссылку на скачивание (может не сработать)
        function getDirectUrl(id) {
            return `https://drive.google.com/uc?export=download&id=${id}`;
        }
        
        const video = document.getElementById('driveVideo');
        const urlDisplay = document.getElementById('urlDisplay');
        const btn = document.getElementById('loadVideoBtn');
        
        btn.addEventListener('click', function() {
            const directUrl = getDirectUrl(VIDEO_ID);
            urlDisplay.textContent = directUrl;
            
            // Очищаем старый источник
            while(video.firstChild) {
                video.removeChild(video.firstChild);
            }
            
            // Создаем новый источник
            const source = document.createElement('source');
            source.src = directUrl;
            source.type = 'video/mp4';
            video.appendChild(source);
            
            // Перезагружаем и пробуем воспроизвести
            video.load();
            video.play().catch(e => {
                console.log('Автовоспроизведение не удалось:', e);
                alert('Не удалось автоматически загрузить видео. Попробуйте Вариант 1 с iframe.');
            });
        });
    </script>
</body>
</html>
